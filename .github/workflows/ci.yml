name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  api-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env for CI
        shell: bash
        run: |
          set -euo pipefail

          # Ports
          WEB_PORT=8080
          API_PORT=3000

          # DB URL (compose-internal)
          DATABASE_URL="postgresql://masterpoint:masterpoint@db:5432/masterpoint?schema=public"

          # JWT_SECRET: Secret nehmen, sonst generieren (>=24 chars)
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          if [ -z "${JWT_SECRET}" ] || [ "${#JWT_SECRET}" -lt 24 ]; then
            JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          fi

          cat > .env <<EOF
          WEB_PORT=${WEB_PORT}
          API_PORT=${API_PORT}
          DATABASE_URL=${DATABASE_URL}
          JWT_SECRET=${JWT_SECRET}
          EOF

      - name: Docker info
        shell: bash
        run: docker version && docker compose version

      - name: Start stack (CI override)
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -p infra -f infra/docker-compose.yml -f infra/docker-compose.ci.yml up -d --build
          docker compose --env-file .env -p infra -f infra/docker-compose.yml -f infra/docker-compose.ci.yml ps

      - name: Wait for API (direct)
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:3000/health" >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API not ready"
          docker compose --env-file .env -p infra -f infra/docker-compose.yml -f infra/docker-compose.ci.yml logs --no-color --tail=400 api worker web db
          exit 1

      - name: Run smoke test (direct)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/smoke_api.sh
          BASE_URL="http://localhost:3000" ./tools/smoke_api.sh

      - name: Shutdown stack
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env -p infra -f infra/docker-compose.yml -f infra/docker-compose.ci.yml down -v