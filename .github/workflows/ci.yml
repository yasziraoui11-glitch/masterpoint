name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  api-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env for docker compose
        shell: bash
        run: |
          cat > .env << 'EOF'
          WEB_PORT=8080
          API_PORT=3000
          DATABASE_URL=postgresql://masterpoint:masterpoint@db:5432/masterpoint?schema=public
          EOF
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

      - name: Docker info
        shell: bash
        run: docker version && docker compose version

      - name: Start DB only
        shell: bash
        run: |
          docker compose --env-file .env -p infra -f infra/docker-compose.yml up -d db
          docker compose --env-file .env -p infra -f infra/docker-compose.yml ps
          docker compose --env-file .env -p infra -f infra/docker-compose.yml logs --no-color --tail=200 db

      - name: Apply Prisma schema to DB (db push)
        shell: bash
        run: |
          docker compose --env-file .env -p infra -f infra/docker-compose.yml run --rm api sh -lc "npx prisma db push"

      - name: Start stack
        shell: bash
        run: |
          docker compose --env-file .env -p infra -f infra/docker-compose.yml up -d api worker web
          docker compose --env-file .env -p infra -f infra/docker-compose.yml ps

      - name: Wait for API via web proxy
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8080/api/health" >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API not ready"
          docker compose --env-file .env -p infra -f infra/docker-compose.yml logs --no-color --tail=400 api worker web db
          exit 1

      - name: Run smoke test
        shell: bash
        run: |
          chmod +x tools/smoke_api.sh
          BASE_URL="http://localhost:8080" ./tools/smoke_api.sh

      - name: Shutdown stack
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env -p infra -f infra/docker-compose.yml down -v