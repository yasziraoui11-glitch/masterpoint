name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.JWT_SECRET }}" || (echo "Missing secret: JWT_SECRET" && exit 1)
          test "${#{{ secrets.JWT_SECRET }}}" -ge 24 || (echo "JWT_SECRET must be >= 24 chars" && exit 1)
          test -n "${{ secrets.INITIAL_ADMIN_EMAIL }}" || (echo "Missing secret: INITIAL_ADMIN_EMAIL" && exit 1)
          test -n "${{ secrets.INITIAL_ADMIN_PASSWORD }}" || (echo "Missing secret: INITIAL_ADMIN_PASSWORD" && exit 1)
          test "${#{{ secrets.INITIAL_ADMIN_PASSWORD }}}" -ge 8 || (echo "INITIAL_ADMIN_PASSWORD must be >= 8 chars" && exit 1)

      - name: Prepare env for docker compose
        shell: bash
        run: |
          set -euo pipefail
          cat > .env << 'ENVEOF'
          WEB_PORT=8080
          API_PORT=3000
          DATABASE_URL=postgresql://masterpoint:masterpoint@db:5432/masterpoint?schema=public
          ENVEOF
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "INITIAL_ADMIN_EMAIL=${{ secrets.INITIAL_ADMIN_EMAIL }}" >> .env
          echo "INITIAL_ADMIN_PASSWORD=${{ secrets.INITIAL_ADMIN_PASSWORD }}" >> .env

      - name: Docker info
        shell: bash
        run: docker version && docker compose version

      - name: Start DB only
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -p infra -f infra/docker-compose.yml up -d db
          docker compose --env-file .env -p infra -f infra/docker-compose.yml ps
          docker compose --env-file .env -p infra -f infra/docker-compose.yml logs --no-color --tail=200 db

      - name: Apply Prisma schema to DB (db push)
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -p infra -f infra/docker-compose.yml run --rm api sh -lc "npx prisma db push"

      - name: Start stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -p infra -f infra/docker-compose.yml up -d api worker web
          docker compose --env-file .env -p infra -f infra/docker-compose.yml ps

      - name: Wait for API (direct)
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS "http://localhost:3000/health" >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API not ready"
          docker compose --env-file .env -p infra -f infra/docker-compose.yml logs --no-color --tail=400 api worker web db
          exit 1

      - name: Run smoke test (direct API)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/smoke_api.sh
          BASE_URL="http://localhost:3000" \
          EMAIL="${{ secrets.INITIAL_ADMIN_EMAIL }}" \
          PASSWORD="${{ secrets.INITIAL_ADMIN_PASSWORD }}" \
          ./tools/smoke_api.sh

      - name: Shutdown stack
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env -p infra -f infra/docker-compose.yml down -v
