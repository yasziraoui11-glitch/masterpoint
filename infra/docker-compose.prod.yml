services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: masterpoint
      POSTGRES_USER: masterpoint
      POSTGRES_PASSWORD: masterpoint
    volumes:
      - mp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterpoint -d masterpoint"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:3000"
    command: ["sh","-c","npx prisma migrate deploy && node src/server.js"]

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh","-c","npx prisma migrate deploy && node src/worker.js"]

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:8080"

volumes:
  mp_pgdata:
